# STU-007 — Studio packaged on the three systems, each package opened before it is kept.
#
# macOS is signed with NodeGX's own Developer ID and notarised when this repository can see the five secrets NodeGX's
# release uses (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID; RELEASE-PROCESS.md
# in NodeGX says what each is). Without them it is signed ad hoc, and Gatekeeper asks a person who downloads it to
# open it from System Settings. Windows and Linux are unsigned, and the Apple secrets never reach them:
# electron-builder falls back from WIN_CSC_LINK to CSC_LINK and would hand the Apple certificate to signtool.
#
# Each job builds, then runs the unpacked app with --smoke twice — the welcome screen, and a copy of the todo
# template — and fails unless both report ready.
#
# P125-CCN006-NODOWNLOAD: a version tag (v0.1.0, matching package.json) also makes a DRAFT GitHub Release holding the
# installers, which a person publishes. nodegx.io/studio/ links them by name through releases/latest/download/,
# so the names carry no version (package.json build.artifactName). On a tag the macOS legs refuse to build without the
# Apple secrets: an ad-hoc build is what Gatekeeper stops after a download, and that is not something to release.
#
# Beta S5: macOS is two legs, one per processor, each built on its own hardware so its --smoke opens the very app it
# keeps — Apple silicon on macos-15, Intel on macos-15-intel. GitHub retired macos-14 (arm64 and Intel) on
# 2026-11-02 (actions/runner-images#15226), after v0.1.0 was built on it, so the arm64 leg moved too. The arch is passed to electron-builder explicitly, never taken from the runner,
# and ${arch} in build.artifactName keeps the two names apart: NodeGX-Studio-mac-arm64.dmg, NodeGX-Studio-mac-x64.dmg.
name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            app: dist/mac-arm64/NodeGX Studio.app
            bin: dist/mac-arm64/NodeGX Studio.app/Contents/MacOS/NodeGX Studio
          - os: macos-15-intel
            arch: x64
            app: dist/mac/NodeGX Studio.app # electron-builder gives x64, its default arch, no suffix
            bin: dist/mac/NodeGX Studio.app/Contents/MacOS/NodeGX Studio
          - os: windows-latest
            bin: dist/win-unpacked/NodeGX Studio.exe
          - os: ubuntu-latest
            bin: dist/linux-unpacked/nodegx-studio
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:vendor
      - name: build (macOS signed and notarised when the secrets are there, ad hoc otherwise)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # an absent secret arrives as an empty string, which electron-builder reads as a certificate path (NodeGX v0.1.0)
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -n "${!v}" ] || unset "$v"; done
          if [ "$GITHUB_REF_TYPE" = tag ] && { [ -z "${CSC_LINK:-}" ] || [ -z "${APPLE_ID:-}" ]; }; then
            echo "::error::a release needs the macOS build signed and notarised: this repository cannot see the Apple secrets"; exit 1
          fi
          if [ -n "${CSC_LINK:-}" ]; then npm run dist:signed -- --${{ matrix.arch }}; else echo "no signing secrets: an ad-hoc build"; npm run dist -- --${{ matrix.arch }}; fi
          ls -l dist/NodeGX-Studio-mac-${{ matrix.arch }}.dmg dist/NodeGX-Studio-mac-${{ matrix.arch }}.zip
          lipo -archs "${{ matrix.bin }}" | tee /dev/stderr | grep -qx '${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}'
          if [ -n "${CSC_LINK:-}" ] && [ -n "${APPLE_ID:-}" ]; then
            spctl -a -vv -t exec "${{ matrix.app }}" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
            xcrun stapler validate "${{ matrix.app }}"
          fi
      - name: the Claude Desktop extension, for Apple silicon and Intel Macs (P128-S3B-MCPBNORELEASE)
        # one leg makes both: the same names from two legs would overwrite each other in the release's merged download
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: |
          npm run mcpb
          npm run mcpb -- --node darwin-x64
          ls -l dist/*.mcpb
      - name: build
        if: runner.os != 'macOS'
        run: npm run dist
      - name: open the package (welcome, then a copy of the todo template)
        env:
          ELECTRON_DISABLE_SANDBOX: '1' # a CI runner's Chromium sandbox cannot start; a person's machine keeps it
          NODEGX_STUDIO_USER_DATA: ${{ runner.temp }}/studio-user-data
          NODEGX_BACKENDS_DIR: ${{ runner.temp }}/studio-backends
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          out=$(run "${{ matrix.bin }}" --smoke) || { echo "$out"; exit 1; }
          echo "$out"; echo "$out" | grep -q '^smoke: ready welcome'
          cp -R vendor/templates/todo-list "$RUNNER_TEMP/todo"
          out=$(run "${{ matrix.bin }}" "$RUNNER_TEMP/todo" --smoke) || { echo "$out"; exit 1; }
          echo "$out"; echo "$out" | grep -q '^smoke: ready todo'
      - uses: actions/upload-artifact@v4
        with:
          name: nodegx-studio-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.mcpb
          if-no-files-found: error

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: a draft release with the installers and the Desktop extension (a person publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $want"; exit 1; }
          # the extension twice: under a name without the server's version (what nodegx.io links, so a release never
          # breaks the link) and with it (which server a person installed)
          files=(NodeGX-Studio-mac-arm64.dmg NodeGX-Studio-mac-arm64.zip NodeGX-Studio-mac-x64.dmg NodeGX-Studio-mac-x64.zip NodeGX-Studio-win-x64.exe NodeGX-Studio-linux-x86_64.AppImage nodegx-darwin-arm64.mcpb nodegx-darwin-x64.mcpb)
          for f in "${files[@]}"; do [ -f "out/$f" ] || { echo "::error::$f is missing"; ls out; exit 1; }; done
          for f in out/nodegx-[0-9]*-darwin-*.mcpb; do [ -f "$f" ] && files+=("${f#out/}"); done
          gh release create "$GITHUB_REF_NAME" --draft --title "NodeGX Studio ${GITHUB_REF_NAME#v}" \
            --notes "macOS: NodeGX-Studio-mac-arm64.dmg (Apple silicon) and NodeGX-Studio-mac-x64.dmg (Intel), both signed and notarised. Windows (unsigned: SmartScreen asks once), Linux (AppImage). The Claude Desktop extension: nodegx-darwin-arm64.mcpb (Apple silicon), nodegx-darwin-x64.mcpb (Intel)." \
            "${files[@]/#/out/}"
