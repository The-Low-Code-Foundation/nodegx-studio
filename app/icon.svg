<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- NodeGX Studio app icon master (Richard picked it, 2026-10-20). NodeGX's mark is two ports and one wire; Studio's
       is the same wire traced as an S: the input port (light) at the top, the output port (NodeGX's accent) at the
       foot, on NodeGX's own tile, gradient and port colours, so it reads as one family.

       The S is two half-turns of radius 150 meeting at the centre (512,512). Rasterise for the window and the Dock:
         rsvg-convert -w 1024 -h 1024 app/icon.svg -o app/icon.png -->
  <defs>
    <linearGradient id="wire" x1="642" y1="287" x2="382" y2="737" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#1570EF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#182231"/>
      <stop offset="1" stop-color="#0B0E12"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="229" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="223" stroke="#232A33" stroke-width="12"/>
  <!-- wire -->
  <path d="M642 287A150 150 0 1 0 512 512A150 150 0 1 1 382 737" stroke="url(#wire)" stroke-width="66" stroke-linecap="round"/>
  <!-- input port -->
  <circle cx="642" cy="287" r="81" fill="#EEF2F6"/>
  <!-- output port (accent) -->
  <circle cx="382" cy="737" r="81" fill="#4DA3FF"/>
</svg>
