<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodeGX Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1024 1024%27%3E%3Crect width=%271024%27 height=%271024%27 rx=%27229%27 fill=%27%230B0E12%27/%3E%3Cpath d=%27M642 287A150 150 0 1 0 512 512A150 150 0 1 1 382 737%27 fill=%27none%27 stroke=%27%232F8AFF%27 stroke-width=%2766%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%27642%27 cy=%27287%27 r=%2781%27 fill=%27%23EEF2F6%27/%3E%3Ccircle cx=%27382%27 cy=%27737%27 r=%2781%27 fill=%27%234DA3FF%27/%3E%3C/svg%3E">
<!--
  STU-003 — the welcome screen: what the desktop app shows with no project open. Reopen the last project, pick another
  recent one, open a folder, start from one of NodeGX's templates, or import an app. Talks to the main process through
  `window.studio` (preload.cjs); reports readiness in document.title for the smoke run and the gate.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* the editor's own tokens (editor/studio.html) */
  :root {
    --bg: #eef0f3; --panel: #ffffff; --panel-2: #f7f8fa; --line: #e3e6eb; --line-2: #d3d7de; --ink: #171b22; --ink-2: #3d4452; --muted: #717886;
    --accent: #1f5eff; --accent-ink: #1446c7; --accent-soft: #e9efff; --accent-line: #b9caff; --danger: #dc2626; --game: #7c3aed; --game-soft: #f1ebfe;
    --r: 6px; --r-lg: 10px; --shadow: 0 10px 30px rgba(17, 24, 39, .10), 0 1px 3px rgba(17, 24, 39, .06);
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 13px; line-height: 1.45; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line-2); background: var(--panel); border-radius: var(--r); padding: 6px 12px; line-height: 18px; display: inline-flex; align-items: center; gap: 7px; }
  button:hover { background: var(--panel-2); border-color: #b8bec8; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  button.primary:hover { background: var(--accent-ink); }
  button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 3px 7px; font-size: 12px; }
  button.quiet:hover { background: var(--panel-2); color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  main { max-width: 1120px; margin: 0 auto; padding: 40px 32px 32px; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 40px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; gap: 28px; padding: 24px 16px; } }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .logo { width: 40px; height: 40px; display: block; flex: none; }
  .brand h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .brand .ver { color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }

  h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
  .path { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .path bdi { direction: ltr; unicode-bidi: isolate; }

  .last { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px 16px 14px; margin-bottom: 22px; }
  .last .name { font-size: 16px; font-weight: 600; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .last .when { color: var(--muted); font-size: 12px; margin: 6px 0 12px; }
  .last .row { display: flex; gap: 8px; align-items: center; }

  .recent { list-style: none; margin: 0; padding: 0; }
  .recent li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; border-radius: var(--r); }
  .recent li > button.item { border: 0; background: transparent; padding: 7px 8px; display: block; text-align: left; min-width: 0; width: 100%; }
  .recent li:hover { background: var(--panel); }
  .recent .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent li .side { display: flex; align-items: center; gap: 2px; padding-right: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .recent li .side .forget { visibility: hidden; }
  .recent li:hover .side .forget, .recent li:focus-within .side .forget { visibility: visible; }
  .recent li.missing .name { color: var(--muted); text-decoration: line-through; }
  .recent li.missing .side .forget { visibility: visible; }
  .empty { color: var(--muted); padding: 14px 2px; }

  .templates { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .tpl { text-align: left; display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 14px 14px 12px; border-radius: var(--r-lg); border-color: var(--line); background: var(--panel); min-height: 150px; }
  .tpl:hover { border-color: var(--accent-line); box-shadow: var(--shadow); background: var(--panel); }
  .tpl .title { font-size: 14px; font-weight: 600; }
  .tpl .summary { color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
  .tag.game { background: var(--game-soft); color: var(--game); }
  .tag.plain { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .intro { color: var(--ink-2); margin: -2px 0 14px; max-width: 60ch; }

  #status { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: min(680px, calc(100% - 32px)); background: #14181f; color: #fff; padding: 10px 14px; border-radius: var(--r-lg); box-shadow: var(--shadow); display: none; align-items: flex-start; gap: 10px; white-space: pre-wrap; }
  #status.on { display: flex; }
  #status.error { background: #fff; color: var(--danger); border: 1px solid #f3c2c2; }
  #status button { margin-left: auto; flex: none; }
  .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; flex: none; margin-top: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { grid-column: 1 / -1; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
  .logo svg { width: 100%; height: 100%; display: block; }
</style>

<main>
  <section aria-label="Your projects">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="wlw" x1="642" y1="287" x2="382" y2="737" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4DA3FF"/><stop offset="1" stop-color="#1570EF"/></linearGradient><radialGradient id="wlg" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#182231"/><stop offset="1" stop-color="#0B0E12"/></radialGradient></defs><rect width="1024" height="1024" rx="229" fill="url(#wlg)"/><rect x="6" y="6" width="1012" height="1012" rx="223" fill="none" stroke="#232A33" stroke-width="12"/><path d="M642 287A150 150 0 1 0 512 512A150 150 0 1 1 382 737" fill="none" stroke="url(#wlw)" stroke-width="66" stroke-linecap="round"/><circle cx="642" cy="287" r="81" fill="#EEF2F6"/><circle cx="382" cy="737" r="81" fill="#4DA3FF"/></svg></div>
      <div><h1>NodeGX Studio</h1><div class="ver" id="ver"></div></div>
    </div>
    <div class="actions">
      <button id="open-folder"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Open a project…</button>
      <button id="import"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>Import an app…</button>
    </div>
    <div id="last"></div>
    <h2 id="recent-head">Recent</h2>
    <ul class="recent" id="recent" aria-labelledby="recent-head"></ul>
  </section>

  <section aria-labelledby="tpl-head">
    <h2 id="tpl-head">Start from a template</h2>
    <p class="intro">A copy of a whole NodeGX app, yours to change. It goes in a new folder you name.</p>
    <div class="templates" id="templates"></div>
  </section>

  <footer>Every project is a folder on this computer. Studio, Claude Code and VS Code all edit the same files.</footer>
</main>
<div id="status" role="status" aria-live="polite"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const c of children) if (c != null) n.append(c);
  return n;
};
const CATEGORY = { 'data-app': 'Data app', game: 'Game', starter: 'Starter', site: 'Site', dashboard: 'Dashboard', form: 'Form', integration: 'Integration' };
let data = null;
let busy = false;

function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return '';
  if (s < 60) return 'just now';
  const [n, unit] = s < 3600 ? [s / 60, 'minute'] : s < 86400 ? [s / 3600, 'hour'] : s < 86400 * 30 ? [s / 86400, 'day'] : [s / (86400 * 30), 'month'];
  const k = Math.floor(n);
  return `${k} ${unit}${k === 1 ? '' : 's'} ago`;
}
// the folder, with the home folder as ~; drawn right-to-left so a long path loses its start, not its name
const pathOf = (dir) => el('div', { className: 'path', title: dir }, el('bdi', { textContent: data.home && dir.startsWith(data.home) ? '~' + dir.slice(data.home.length) : dir }));

function status(text, kind) {
  const s = $('#status');
  s.className = text ? `on ${kind || ''}` : '';
  s.replaceChildren();
  if (!text) return;
  if (kind === 'busy') s.append(el('div', { className: 'spin' }));
  s.append(el('div', { textContent: text }));
  if (kind === 'error') s.append(el('button', { className: 'quiet', textContent: 'Dismiss', onclick: () => status() }));
}

const lock = (on) => {
  busy = on;
  for (const b of document.querySelectorAll('button')) b.disabled = on;
};
/** Runs one action. One that worked leaves the page locked: the project it opens replaces this page (and if that
    fails, the main process says so with an empty busy message, which unlocks it). */
async function act(call) {
  if (busy) return;
  lock(true);
  let r;
  try {
    r = await call();
  } catch (err) {
    r = { error: err.message };
  }
  if (r?.error || r?.cancelled) {
    lock(false);
    status(r.error, 'error');
  }
  return r;
}
/** What the main process is doing once its dialogs are answered. It travels apart from the action's answer and can
    arrive after it: a refusal must not be painted over by the "Copying…" that came before it. */
studio.onBusy((text) => {
  if (!busy) return;
  if (!text) {
    lock(false);
    return status();
  }
  status(text, 'busy');
});

function render() {
  $('#ver').textContent = `Version ${data.version}`;
  const [last, ...rest] = data.recent;
  const lastBox = $('#last');
  lastBox.replaceChildren();
  if (last?.exists) {
    lastBox.append(el('div', { className: 'last', id: 'reopen-card' },
      el('h2', { textContent: 'Continue where you left off' }),
      el('div', { className: 'name', textContent: last.name }),
      pathOf(last.dir),
      el('div', { className: 'when', textContent: `Opened ${ago(last.openedAt)}` }),
      el('div', { className: 'row' },
        el('button', { className: 'primary', id: 'reopen', textContent: `Reopen ${last.name}`, onclick: () => act(() => studio.open(last.dir)) }),
        el('button', { className: 'quiet', textContent: 'Show in folder', onclick: () => studio.reveal(last.dir) }))));
  }
  const list = $('#recent');
  list.replaceChildren();
  const others = last?.exists ? rest : data.recent;
  $('#recent-head').textContent = last?.exists ? 'Other recent projects' : 'Recent projects';
  if (!others.length) list.append(el('li', { className: 'empty', textContent: data.recent.length ? 'No other projects yet.' : 'Projects you open or create appear here.' }));
  for (const p of others) {
    const li = el('li', { className: p.exists ? '' : 'missing' });
    li.dataset.dir = p.dir;
    li.append(
      el('button', { className: 'item', title: p.exists ? `Open ${p.dir}` : `${p.dir} was moved or deleted`, onclick: () => act(() => studio.open(p.dir)) },
        el('div', { className: 'name', textContent: p.name }), pathOf(p.dir)),
      el('div', { className: 'side' },
        el('span', { textContent: p.exists ? ago(p.openedAt) : 'not found' }),
        el('button', { className: 'quiet forget', title: 'Remove from this list (the folder stays)', 'aria-label': `Remove ${p.name} from the list`, textContent: '✕',
          onclick: async () => { await studio.forget(p.dir); data = await studio.welcome(); render(); } })));
    list.append(li);
  }
  const grid = $('#templates');
  grid.replaceChildren();
  for (const t of data.templates) {
    const b = el('button', { className: 'tpl', disabled: !t.available, title: t.available ? `Make a new project from ${t.title}` : 'Not in this NodeGX checkout' },
      el('div', { className: 'title', textContent: t.title }),
      el('div', { className: 'summary', textContent: t.summary }),
      el('div', { className: 'tags' },
        el('span', { className: `tag ${t.category === 'game' ? 'game' : ''}`, textContent: CATEGORY[t.category] ?? t.category }),
        t.needsBackend ? el('span', { className: 'tag plain', textContent: 'Needs a backend' }) : null));
    b.dataset.slug = t.slug;
    b.onclick = () => act(() => studio.newFromTemplate(t.slug));
    grid.append(b);
  }
}

$('#open-folder').onclick = () => act(() => studio.openFolder());
$('#import').onclick = () => act(() => studio.importApp());

(async () => {
  data = await studio.welcome();
  if (data.error) return status(data.error, 'error');
  render();
  (document.querySelector('#reopen') || document.querySelector('.tpl:not(:disabled)'))?.focus();
  document.title = `ready welcome · ${data.recent.length} recent · ${data.templates.filter((t) => t.available).length} templates`;
})();
</script>
